<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Box Triggers</title>
</head>
<body>

    <!-- Displays a standard informational popup notification window with a single OK confirmation button -->
    <button onclick="alert('this is alert box!')">alert</button>

    <!-- Displays a verification choice box containing both OK and Cancel options to capture user confirmation -->
    <button onclick="confirm('this is confirm box!')">confirm</button>

    <!-- Displays an interactive modal window with an editable text slot to collect direct input variables from the user -->
    <button onclick="prompt('this is prompt box!')">prompt</button>

</body>
</html>
