<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Event Attributes</title>
</head>
<body>

    <!-- Displays the graphic at half screen width, triggers a popup on hover, and triggers another popup when clicked -->
    <img src="2.jpg" width="50%" alt="house" onmouseover="alert('mouse over image')" onclick="alert('image of house')">
    
    <!-- Heading text that displays a popup notification when the user's mouse cursor exits the text boundary area -->
    <h2 onmouseout="alert('mouse out of text')">image of house</h2>

</body>
</html>
